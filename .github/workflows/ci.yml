name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} / Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]
        node: ["22"]
        include:
          - os: ubuntu-latest
            python: "3.13"
            node: "24"
          - os: macos-latest
            python: "3.13"
            node: "24"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - name: Scrub check
        run: python scripts/scrub_check.py
      - name: Compile
        run: python -m compileall -q src
      - name: Unit tests (no network; loopback fakes only)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B -m unittest discover -s tests -v

  python-only:
    name: Python side without Node
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Hide Node so the fake runner path is exercised
        run: |
          for n in $(which -a node || true); do sudo mv "$n" "$n.hidden" || true; done
          ! command -v node
      - name: Unit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B -m unittest discover -s tests -v

  distribution:
    name: Installed wheel and sdist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Lint and build
        run: |
          python -m pip install build ruff
          ruff check src tests scripts
          python -m build > "$RUNNER_TEMP/build.log" 2>&1 || { cat "$RUNNER_TEMP/build.log"; exit 1; }
          if grep -q "Package would be ignored" "$RUNNER_TEMP/build.log"; then
            cat "$RUNNER_TEMP/build.log"
            echo "setuptools warned that a package directory would be ignored"
            exit 1
          fi
          python - << 'PY'
          import tarfile
          from pathlib import Path
          archives = sorted(Path("dist").glob("*.tar.gz"))
          if len(archives) != 1:
              raise SystemExit(f"expected one sdist, found {archives}")
          names = tarfile.open(archives[0]).getnames()
          roots = {name.split("/")[0] for name in names}
          if len(roots) != 1:
              raise SystemExit(f"expected one sdist root, found {roots}")
          root = roots.pop()
          required = [
              "tests/support.py",
              "scripts/scrub_check.py",
              "scripts/installed_smoke.py",
              "scripts/stdio_handshake.py",
              "scripts/suite_compat.py",
          ]
          missing = [item for item in required if f"{root}/{item}" not in names]
          if missing:
              raise SystemExit("sdist is missing " + ", ".join(missing))
          print("sdist includes test helpers and scripts")
          PY
      - name: Install and check both distributions outside the checkout
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          for artifact in "$GITHUB_WORKSPACE"/dist/*; do
            python -m venv "$RUNNER_TEMP/installed"
            "$RUNNER_TEMP/installed/bin/python" -m pip install "$artifact"
            cd "$RUNNER_TEMP"
            "$RUNNER_TEMP/installed/bin/python" -I "$GITHUB_WORKSPACE/scripts/installed_smoke.py"
            AGIW_MCP_TEST_INSTALLED=1 "$RUNNER_TEMP/installed/bin/python" -B -m unittest discover \
              -s "$GITHUB_WORKSPACE/tests" -p test_nisi_model_responses.py -v
            cd "$GITHUB_WORKSPACE"
            rm -rf "$RUNNER_TEMP/installed"
          done

  uv-git-install:
    name: uv tool install from git
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install this commit and speak MCP
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/uv-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/uv-bin
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -eu
          ref="${{ github.event.pull_request.head.sha }}"
          repo="${{ github.event.pull_request.head.repo.full_name }}"
          if [ -z "$ref" ]; then ref="${{ github.sha }}"; fi
          if [ -z "$repo" ]; then repo="${{ github.repository }}"; fi
          url="git+https://github.com/${repo}@${ref}"
          echo "installing ${url}"
          uv tool install "$url"
          "$UV_TOOL_BIN_DIR/agiw-mcp" --version
          python3 scripts/stdio_handshake.py "$UV_TOOL_BIN_DIR/agiw-mcp"
          "$UV_TOOL_DIR/agiw-mcp/bin/python" -I "$GITHUB_WORKSPACE/scripts/installed_smoke.py"

  windows:
    name: Python 3.12 / Node 22 / windows-latest
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Scrub check
        run: python scripts/scrub_check.py
      - name: Compile
        run: python -m compileall -q src
      - name: Unit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B -m unittest discover -s tests -v

  suite-compat:
    name: AGIW Suite main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Check the shared Nisi bundle and Jev pin
        run: |
          set -eu
          git clone --depth 1 https://github.com/louiscalata/agiw-suite.git "$RUNNER_TEMP/agiw-suite"
          PYTHONPATH=src python scripts/suite_compat.py "$RUNNER_TEMP/agiw-suite"
