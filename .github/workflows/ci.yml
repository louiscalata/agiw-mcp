name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} / Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]
        node: ["22"]
        include:
          - os: ubuntu-latest
            python: "3.13"
            node: "24"
          - os: macos-latest
            python: "3.13"
            node: "24"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - name: Scrub check
        run: python scripts/scrub_check.py
      - name: Compile
        run: python -m compileall -q src
      - name: Unit tests (no network; loopback fakes only)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B -m unittest discover -s tests -v

  python-only:
    name: Python side without Node
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Hide Node so the fake runner path is exercised
        run: |
          for n in $(which -a node || true); do sudo mv "$n" "$n.hidden" || true; done
          ! command -v node
      - name: Unit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B -m unittest discover -s tests -v

  distribution:
    name: Installed wheel and sdist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Lint and build
        run: |
          python -m pip install build ruff
          ruff check src tests scripts
          python -m build
      - name: Install and check both distributions outside the checkout
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          for artifact in "$GITHUB_WORKSPACE"/dist/*; do
            python -m venv "$RUNNER_TEMP/installed"
            "$RUNNER_TEMP/installed/bin/python" -m pip install "$artifact"
            cd "$RUNNER_TEMP"
            "$RUNNER_TEMP/installed/bin/python" -I "$GITHUB_WORKSPACE/scripts/installed_smoke.py"
            AGIW_MCP_TEST_INSTALLED=1 "$RUNNER_TEMP/installed/bin/python" -B -m unittest discover \
              -s "$GITHUB_WORKSPACE/tests" -p test_nisi_model_responses.py -v
            cd "$GITHUB_WORKSPACE"
            rm -rf "$RUNNER_TEMP/installed"
          done
