name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} / Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]
        node: ["22"]
        include:
          - os: ubuntu-latest
            python: "3.13"
            node: "24"
          - os: macos-latest
            python: "3.13"
            node: "24"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Scrub check
        run: python scripts/scrub_check.py
      - name: Compile
        run: python -m compileall -q src
      - name: Unit tests (no network; loopback fakes only)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B -m unittest discover -s tests -v

  python-only:
    name: Python side without Node
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hide Node so the fake runner path is exercised
        run: |
          for n in $(which -a node || true); do sudo mv "$n" "$n.hidden" || true; done
          ! command -v node
      - name: Unit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B -m unittest discover -s tests -v
