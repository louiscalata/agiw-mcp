[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agiw-mcp"
version = "0.1.0"
description = "A local stdio MCP server: readiness for online code mode, advisory Jev checks with consent, and one-shot Nisi workflow runs on local models."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Louis Calata" }]
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/louiscalata/agiw-mcp"
Issues = "https://github.com/louiscalata/agiw-mcp/issues"

[project.scripts]
agiw-mcp = "agiw_mcp.__main__:main"

# Namespace discovery keeps the vendored Nisi directories on the package list.
# Without that, setuptools warns that those directories "would be ignored"
# even though package-data still copies the files.
[tool.setuptools.packages.find]
where = ["src"]
include = ["agiw_mcp*"]
namespaces = true

[tool.setuptools.package-data]
agiw_mcp = [
    "nisi_runner.mjs",
    "vendor/nisi/manifest.json",
    "vendor/nisi/package/*",
    "vendor/nisi/package/*/*",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]

[tool.ruff.lint.per-file-ignores]
"src/agiw_mcp/questions.py" = ["E501"]
